<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Exact Gradient as og-image.jpg: Violet to Cyan -->
    <linearGradient id="aura-chat-grad" x1="30" y1="30" x2="98" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Dark Background -->
  <rect width="128" height="128" rx="28" fill="#0b0f19"/>

  <!-- Glowing Minimalist Chat Bubble matching og-image.jpg -->
  <g filter="url(#aura-glow)">
    <!-- Round Speech Bubble Outline with bottom-left pointer -->
    <path d="M64 26C42.46 26 25 42.12 25 62C25 72.8 30.12 82.45 38.35 88.85C37.2 96.1 33.1 100.8 32.8 101.12C32.15 101.85 32.55 103 33.55 103.15C38.2 103.85 46.2 101.9 53.6 96.5C56.95 97.48 60.42 98 64 98C85.54 98 103 81.88 103 62C103 42.12 85.54 26 64 26Z" 
          fill="none" 
          stroke="url(#aura-chat-grad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- 3 Glowing Chat Dots inside Bubble -->
    <circle cx="50" cy="62" r="4.5" fill="url(#aura-chat-grad)"/>
    <circle cx="64" cy="62" r="4.5" fill="url(#aura-chat-grad)"/>
    <circle cx="78" cy="62" r="4.5" fill="url(#aura-chat-grad)"/>
  </g>
</svg>